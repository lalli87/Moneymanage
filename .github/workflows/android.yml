name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_PATH: ${{ runner.temp }}/moneybook-release.p12
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$KS_PATH"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MoneyBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-apk
          path: MoneyBook.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: MoneyBook for Android (build ${{ github.run_number }})
          body: Open this page on your phone and tap MoneyBook.apk to install or update.
          files: MoneyBook.apk
          make_latest: true
