name: Update Statistics Canada food prices

# Refreshes data/statcan.json (food CPI and average retail prices) for the Price book.
# StatCan publishes CPI around the third week of each month; this checks weekly.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/statcan.py', '.github/workflows/statcan.yml']
  schedule:
    - cron: '17 15 * * 3'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and pack
        run: python tools/statcan.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/statcan.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update Statistics Canada food prices"
          git pull --rebase -q && git push
