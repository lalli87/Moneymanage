<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MoneyBook</title>
<meta name="description" content="Personal money tracker with mortgage tracking, receipt scanning and Google Drive sync.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8685a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem("mb_local")||"{}").theme;if(t&&t!=="system")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header id="top">
  <h1 id="title">MoneyBook</h1>
  <button id="syncBtn" class="iconbtn" data-act="sync" title="Sync with Google Drive" aria-label="Sync">⟳</button>
</header>
<main id="view"></main>
<button id="fab" data-act="addTxn" aria-label="Add transaction">+</button>
<nav id="tabs">
  <button data-act="tab" data-tab="trans"><i>📒</i><span>Trans.</span></button>
  <button data-act="tab" data-tab="calendar"><i>📅</i><span>Calendar</span></button>
  <button data-act="tab" data-tab="stats"><i>📊</i><span>Stats</span></button>
  <button data-act="tab" data-tab="accounts"><i>🏦</i><span>Accounts</span></button>
  <button data-act="tab" data-tab="more"><i>⋯</i><span>More</span></button>
</nav>
<div id="sheet" class="hidden" role="dialog" aria-modal="true">
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <div class="sheet-body"></div>
</div>
<div id="toast" role="status"></div>
<div id="lock" class="hidden" role="dialog" aria-modal="true" aria-label="MoneyBook is locked">
  <div class="lockbox">
    <div style="font-size:44px">🔒</div><h2>MoneyBook</h2>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Enter PIN" aria-label="PIN">
    <div class="row"><button class="primary" id="unlockBtn">Unlock</button><button class="secondary" id="bioBtn">👆 Fingerprint</button></div>
    <div id="lockMsg" class="hint"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
